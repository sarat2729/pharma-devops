name: "CI/CD - Pharma UI"

on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**", "hotfix/**"]
    paths:
      - "services/pharma-ui/**"
      - ".github/workflows/ci-pharma-ui.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/pharma-ui/**"

permissions:
  id-token: write
  contents: read

jobs:
  ci-cd:
    uses: ./.github/workflows/_reusable-nodejs.yml
    with:
      service-name: pharma-ui
      service-path: services/pharma-ui
    secrets: inherit
